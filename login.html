<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SYNCIFY</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="cloud.css"></head><body><main class="login-shell"><div class="login-card"><img class="login-logo" src="assets/syncify-logo.png" alt="SYNCIFY"><span class="eyebrow">QUOTATION STUDIO</span><h1>Your projects, connected.</h1><p>Sign in to access your catalog and quotations.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="button primary full" id="signIn">Sign in</button><button type="button" id="forgot" class="text-button">Send password reset email</button></form><form id="passwordForm" hidden><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><button class="button primary full">Set password</button></form><p id="authMessage" role="status" class="auth-message"></p><p class="helper">Access is limited to approved SYNCIFY accounts.</p></div></main><script type="module" src="login.js"></script></body></html>
